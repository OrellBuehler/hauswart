<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta
      name="theme-color"
      content="#fafbfc"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0e0f13"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="hauswart" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script nonce="%sveltekit.nonce%">
      // Applies the stored colour mode before first paint (same logic as mode-watcher's head
      // script, which cannot carry the CSP nonce). Storage key and class match ModeWatcher.
      (function () {
        var root = document.documentElement;
        var mode = localStorage.getItem("mode-watcher-mode") || "system";
        var light =
          mode === "light" ||
          (mode === "system" &&
            window.matchMedia("(prefers-color-scheme: light)").matches);
        root.classList.toggle("dark", !light);
        root.style.colorScheme = light ? "light" : "dark";
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
