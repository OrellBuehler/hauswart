name: Hauswart
options:
  bundleIdPrefix: ch.orellbuehler
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"

settings:
  base:
    # Swift 5 mode with minimal concurrency checking: the views use the Kotlin types of the shared
    # framework directly, and those are not Sendable.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGNING_ALLOWED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_CFBundleDisplayName: hauswart

targets:
  Hauswart:
    type: application
    platform: iOS
    sources:
      - path: Hauswart
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: ch.orellbuehler.hauswart
        # Link the KMP shared framework. Gradle builds it and the workflow stages it under
        # shared/build/xcode-frameworks/<configuration>/<sdk>/ (see mobile-ios.yml).
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "-framework"
          - "shared"
    info:
      path: Hauswart/Info.plist
      properties:
        # Only standard (exempt) encryption is used, so TestFlight skips the export-compliance
        # question on every upload.
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - en
          - de
        # The server is self-hosted and often reached as http://<address> on the home network, so
        # the app cannot require TLS for an address it does not know in advance.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Local reminders: a background refresh plans them again now and then.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - ch.orellbuehler.hauswart.refresh
        NSLocalNetworkUsageDescription: hauswart connects to your own server, which may be on your home network.
        # Attachments: a photo taken for an entry, and photos or files picked for it.
        NSCameraUsageDescription: hauswart uses the camera to take photos that you attach to entries.
        NSPhotoLibraryUsageDescription: hauswart reads the photos you choose to attach to entries.
        # Phone contacts: the contacts chosen in the app are written into the address book.
        NSContactsUsageDescription: hauswart adds the contacts you choose to your phone's contacts and keeps them up to date.
    dependencies:
      - framework: "../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/shared.framework"
        embed: false
