name: Mobile Store Screenshots

# Captures the store screenshots of both apps in English and German: builds the server and the
# debug apps, fills a server with the invented demo household (scripts/demo.ts) and starts the app
# once per screen (mobile/scripts/screenshots), then renders the images for the store listings
# from them (mobile/store). Run it by hand and download the artifact `store-assets`; the raw
# screenshots are `store-screenshots-ios` and `store-screenshots-android`. See mobile/RELEASING.md.
on:
  workflow_dispatch:
  # Also when the capture itself changes, so a broken script or demo household shows up on the
  # pull request instead of on the next manual run.
  pull_request:
    paths:
      - ".github/workflows/mobile-screenshots.yml"
      - "mobile/scripts/screenshots/**"
      - "mobile/store/**"
      - "scripts/demo.ts"
      - "seed/example.*.json"
      - "mobile/iosApp/Hauswart/Support/ScreenshotRun.swift"
      - "mobile/shared/src/commonMain/kotlin/ch/orellbuehler/hauswart/feature/connect/ScreenshotSession.kt"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: mobile-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the Xcode runner
        uses: ./.github/actions/ios-setup

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Build the server
        working-directory: ${{ github.workspace }}
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build shared iOS framework
        run: ./gradlew shared:linkDebugFrameworkIosSimulatorArm64

      - name: Stage shared framework for Xcode
        run: |
          SDK_NAME=$(xcrun --sdk iphonesimulator --show-sdk-version)
          DEST="shared/build/xcode-frameworks/Debug/iphonesimulator${SDK_NAME}"
          mkdir -p "$DEST"
          cp -R shared/build/bin/iosSimulatorArm64/debugFramework/shared.framework "$DEST/"

      - name: Generate Xcode project
        working-directory: mobile/iosApp
        run: xcodegen generate

      # The 6.9 inch App Store slot is the Pro Max screen (1320 x 2868).
      - name: Pick a Pro Max simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[]
             | select(.key | test("iOS"))
             | .value[]
             | select(.name | test("^iPhone.*Pro Max$"))
             | .udid] | last')
          if [ -z "$DEVICE_ID" ] || [ "$DEVICE_ID" = "null" ]; then
            echo "No iPhone Pro Max simulator available" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      # Signed to run locally, unlike the build of mobile-ios.yml: an unsigned app has no keychain
      # in the simulator, so it could not keep the device token and every screen would say that
      # the person is signed out.
      - name: Build iOS app
        working-directory: mobile/iosApp
        env:
          XCODEBUILD_LOG: ${{ runner.temp }}/xcodebuild.log
        run: |
          set +e
          xcodebuild build \
            -project Hauswart.xcodeproj \
            -scheme Hauswart \
            -destination "id=$DEVICE_ID" \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            ARCHS=arm64 > "$XCODEBUILD_LOG" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "=== Compiler and build errors ==="
            { grep -E '(error|fatal error):' "$XCODEBUILD_LOG" || true; } | sed "s#$GITHUB_WORKSPACE/##" | awk '!seen[$0]++'
            echo "=== Last 150 lines of the xcodebuild log ==="
            tail -n 150 "$XCODEBUILD_LOG"
            exit "$status"
          fi
          tail -n 5 "$XCODEBUILD_LOG"

      - name: Boot simulator and install app
        working-directory: mobile/iosApp
        run: |
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/DerivedData/Build/Products/Debug-iphonesimulator/Hauswart.app

      - name: Capture screenshots
        run: scripts/screenshots/ios.sh "$DEVICE_ID" "$RUNNER_TEMP/store-screenshots"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: store-screenshots-ios
          path: ${{ runner.temp }}/store-screenshots
          retention-days: 14
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        # The legacy 'tools' package the action installs by default was removed
        # from the SDK repository (android-actions/setup-android#537), so the
        # default 'tools platform-tools' list makes sdkmanager exit 1.
        with:
          packages: platform-tools

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-android-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle*', 'mobile/gradle/libs.versions.toml', 'mobile/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Build the server
        working-directory: ${{ github.workspace }}
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build debug APK
        run: ./gradlew androidApp:assembleDebug

      # Pixel 3: 1080 x 2160, the tallest shape Google Play accepts for a phone screenshot (2:1).
      - name: Capture screenshots on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_3
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio
          working-directory: mobile
          script: |
            adb install -r androidApp/build/outputs/apk/debug/androidApp-debug.apk
            scripts/screenshots/android.sh "$RUNNER_TEMP/store-screenshots"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: store-screenshots-android
          path: ${{ runner.temp }}/store-screenshots
          retention-days: 14
          if-no-files-found: error

  # The images for the store listings: every slide of mobile/store/slides.ts with its headline and
  # the screen in a phone frame, and the feature graphic of Google Play.
  assets:
    needs: [ios, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Download the iOS screenshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-screenshots-ios
          path: ${{ runner.temp }}/raw/ios

      - name: Download the Android screenshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-screenshots-android
          path: ${{ runner.temp }}/raw/android

      - name: Render the store images
        run: bun mobile/store/render.ts --ios "$RUNNER_TEMP/raw/ios" --android "$RUNNER_TEMP/raw/android" --out "$RUNNER_TEMP/store-assets"

      - name: Upload the store images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: store-assets
          path: ${{ runner.temp }}/store-assets
          retention-days: 14
          if-no-files-found: error
