name: Mobile Android

on:
  # No workflow-level `paths:` for pull requests: a required check from a
  # workflow that never starts stays "expected" forever and blocks the PR.
  # The `changes` job filters instead and the gate job always reports.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "messages/**"
      - "docs/openapi.json"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              - 'mobile/**'
              - 'messages/**'
              - 'docs/openapi.json'
              - '.github/workflows/mobile-android.yml'

  build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        # The legacy 'tools' package the action installs by default was removed
        # from the SDK repository (android-actions/setup-android#537), so the
        # default 'tools platform-tools' list makes sdkmanager exit 1.
        with:
          packages: platform-tools

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-android-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle*', 'mobile/gradle/libs.versions.toml', 'mobile/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Run ktlint
        run: ./gradlew shared:ktlintCheck androidApp:ktlintCheck

      - name: Build debug APK
        run: ./gradlew androidApp:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: debug-apk
          path: mobile/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

  lint:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        # The legacy 'tools' package the action installs by default was removed
        # from the SDK repository (android-actions/setup-android#537), so the
        # default 'tools platform-tools' list makes sdkmanager exit 1.
        with:
          packages: platform-tools

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-android-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle*', 'mobile/gradle/libs.versions.toml', 'mobile/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Run Android lint
        run: ./gradlew androidApp:lintDebug

      - name: Run shared module tests
        run: ./gradlew shared:allTests

      - name: Run Android unit tests
        run: ./gradlew androidApp:testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: |
            mobile/androidApp/build/reports/tests/
            mobile/shared/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  # Always-reporting required check. A skipped job (nothing relevant changed)
  # counts as passing; a failed or cancelled one fails the gate.
  mobile-android-gate:
    if: always()
    permissions: {}
    needs: [changes, build, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Android jobs to have passed or been skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then
            exit 1
          fi
