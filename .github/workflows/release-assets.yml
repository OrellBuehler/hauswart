name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the MCP binaries to
        required: true

permissions: {}

jobs:
  mcp:
    name: MCP server binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Compile for every platform
        run: |
          mkdir -p dist
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            ext=""
            if [ "${target%%-*}" = "windows" ]; then ext=".exe"; fi
            bun build mcp/src/index.ts --compile --target="bun-$target" \
              --outfile "dist/hauswart-mcp-$target$ext"
          done
          (cd dist && sha256sum hauswart-mcp-* > SHA256SUMS)
          ls -l dist

      - name: Check the binary starts
        run: |
          # Without configuration it must exit with its own message instead of crashing.
          out=$(env -u HAUSWART_URL -u HAUSWART_TOKEN ./dist/hauswart-mcp-linux-x64 </dev/null 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q '^hauswart-mcp: Invalid configuration'

      - name: Attach to the release
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
