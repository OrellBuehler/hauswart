version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    # vitest 5.1.1 cannot stop its workers under the bun runtime (setMaxListeners(-1)); no test runs.
    ignore:
      - dependency-name: "vitest"
        versions: ["5.1.1"]
      - dependency-name: "@vitest/coverage-v8"
        versions: ["5.1.1"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Gradle (Kotlin Multiplatform / Android)
  - package-ecosystem: "gradle"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    groups:
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # SKIE hard-fails the build on any Kotlin version it hasn't whitelisted.
    # Bump Kotlin by hand together with SKIE.
    ignore:
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "org.jetbrains.kotlin.*"
